name: Qualiswift Playwright Automation

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Execute Playwright tests
        run: |
          status=0
          found=0
          for config in qualiswift/*/playwright.config.ts; do
            [ -f "$config" ] || continue
            found=1
            npx playwright test --config="$config" || status=1
          done
          [ "$found" -eq 1 ] || exit 1
          exit "$status"

      - name: Upload execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-execution-results
          path: |
            **/playwright-report/
            **/test-results/
          retention-days: 15
